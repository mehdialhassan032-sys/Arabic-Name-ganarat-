<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arabic Name Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
            text-align: center;
            position: relative;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .btn-filter {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.2s ease;
        }

        .btn-filter.active {
            background: #2c3e50;
            color: white;
            border-color: #2c3e50;
        }

        .display-area {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }

        .name-info {
            text-align: right;
            width: 100%;
        }

        .label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .arabic-val {
            color: #0f766e;
            font-size: 1.5rem;
            font-weight: bold;
            direction: rtl;
        }

        .btn-copy-small {
            background: #e2e8f0;
            color: #334155;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            margin-right: 10px;
        }

        .btn-copy-small:hover {
            background: #cbd5e1;
        }

        .btn-copy-small.copied {
            background: #10b981;
            color: white;
        }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-primary {
            background: #0f766e;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #0d9488;
        }

        .btn-secondary {
            background: transparent;
            color: #64748b;
            border: 1px solid #cbd5e1;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: #f1f5f9;
        }

        .btn-secondary.copied {
            background: #10b981;
            color: white;
            border-color: #10b981;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Arabic Name Generator</h2>
    
    <!-- Filter Buttons -->
    <div class="controls">
        <button class="btn-filter active" onclick="setGender('all', this)">All</button>
        <button class="btn-filter" onclick="setGender('male', this)">Male 👨</button>
        <button class="btn-filter" onclick="setGender('female', this)">Female 👩</button>
    </div>

    <!-- Display Area -->
    <div class="display-area">
        
        <!-- First Name Row -->
        <div class="name-row">
            <button class="btn-copy-small" onclick="copyText('firstNameAr', this)">Copy First</button>
            <div class="name-info">
                <div class="label">FIRST NAME</div>
                <div class="arabic-val" id="firstNameAr">-</div>
            </div>
        </div>

        <!-- Last Name Row -->
        <div class="name-row">
            <button class="btn-copy-small" onclick="copyText('lastNameAr', this)">Copy Last</button>
            <div class="name-info">
                <div class="label">LAST NAME</div>
                <div class="arabic-val" id="lastNameAr">-</div>
            </div>
        </div>

    </div>

    <!-- Actions -->
    <div class="action-btns">
        <button class="btn-primary" onclick="generateName()">Generate Name</button>
        <button class="btn-secondary" id="fullCopyBtn" onclick="copyFullName(this)">Copy Full Name</button>
    </div>
</div>

<script>
    // Pure Arabic First Names
    const firstNames = [
        // Male
        { ar: "طارق", gender: "male" },
        { ar: "زايد", gender: "male" },
        { ar: "فارس", gender: "male" },
        { ar: "كريم", gender: "male" },
        { ar: "عمر", gender: "male" },
        { ar: "أمير", gender: "male" },
        { ar: "حمزة", gender: "male" },
        { ar: "يوسف", gender: "male" },
        // Female
        { ar: "نور", gender: "female" },
        { ar: "ليلى", gender: "female" },
        { ar: "زهراء", gender: "female" },
        { ar: "آية", gender: "female" },
        { ar: "مريم", gender: "female" },
        { ar: "أميرة", gender: "female" },
        { ar: "سارة", gender: "female" },
        { ar: "فاطمة", gender: "female" }
    ];

    // Pure Arabic Last Names
    const lastNames = [
        { ar: "المصري" },
        { ar: "الحسن" },
        { ar: "النجار" },
        { ar: "السيّد" },
        { ar: "الشريف" },
        { ar: "الملك" },
        { ar: "العلي" },
        { ar: "المنصور" }
    ];

    let currentGender = 'all';

    function setGender(gender, element) {
        currentGender = gender;
        document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        generateName();
    }

    function generateName() {
        let filteredFirst = firstNames;
        if (currentGender !== 'all') {
            filteredFirst = firstNames.filter(n => n.gender === currentGender);
        }

        const randomFirst = filteredFirst[Math.floor(Math.random() * filteredFirst.length)];
        const randomLast = lastNames[Math.floor(Math.random() * lastNames.length)];

        document.getElementById('firstNameAr').textContent = randomFirst.ar;
        document.getElementById('lastNameAr').textContent = randomLast.ar;
    }

    // Copy single name silently (No Browser Popup)
    function copyText(elementId, btnElement) {
        const textToCopy = document.getElementById(elementId).textContent;
        if (textToCopy === "-") return;

        navigator.clipboard.writeText(textToCopy).then(() => {
            const originalText = btnElement.textContent;
            btnElement.textContent = "Copied! ✓";
            btnElement.classList.add('copied');
            
            setTimeout(() => {
                btnElement.textContent = originalText;
                btnElement.classList.remove('copied');
            }, 1500);
        });
    }

    // Copy Full Name silently (No Browser Popup)
    function copyFullName(btnElement) {
        const fAr = document.getElementById('firstNameAr').textContent;
        const lAr = document.getElementById('lastNameAr').textContent;

        if (fAr === "-") return;

        const fullName = `${fAr} ${lAr}`;
        navigator.clipboard.writeText(fullName).then(() => {
            const originalText = btnElement.textContent;
            btnElement.textContent = "Copied Full Name! ✓";
            btnElement.classList.add('copied');

            setTimeout(() => {
                btnElement.textContent = originalText;
                btnElement.classList.remove('copied');
            }, 1500);
        });
    }

    // Run automatically on load
    window.onload = function() {
        generateName();
    };
</script>

</body>
</html>
