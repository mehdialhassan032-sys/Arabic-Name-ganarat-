<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Name Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h2 {
            color: #1e293b;
            margin-bottom: 20px;
        }

        .lang-select-box {
            margin-bottom: 20px;
            text-align: left;
        }

        .lang-select-box label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            display: block;
            margin-bottom: 6px;
        }

        .select-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 2px solid #cbd5e1;
            font-size: 1rem;
            font-weight: 600;
            color: #1e293b;
            background: #ffffff;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .select-input:focus {
            border-color: #0f766e;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .btn-filter {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.2s ease;
        }

        .btn-filter.active {
            background: #0f766e;
            color: white;
            border-color: #0f766e;
        }

        .display-area {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }

        .name-info {
            text-align: left;
            width: 100%;
        }

        .label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .name-val {
            color: #0f766e;
            font-size: 1.4rem;
            font-weight: bold;
        }

        .rtl-text {
            direction: rtl;
            text-align: right;
        }

        .btn-copy-small {
            background: #e2e8f0;
            color: #334155;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            margin-left: 10px;
        }

        .btn-copy-small:hover {
            background: #cbd5e1;
        }

        .btn-copy-small.copied {
            background: #10b981;
            color: white;
        }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-primary {
            background: #0f766e;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #0d9488;
        }

        .btn-secondary {
            background: transparent;
            color: #64748b;
            border: 1px solid #cbd5e1;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: #f1f5f9;
        }

        .btn-secondary.copied {
            background: #10b981;
            color: white;
            border-color: #10b981;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>AI Smart Name Generator</h2>

    <!-- Language Select Box (English Added) -->
    <div class="lang-select-box">
        <label for="languageSelect">Select Language / Language Choose</label>
        <select id="languageSelect" class="select-input" onchange="generateAIName()">
            <option value="en">English Names 🇬🇧</option>
            <option value="ar">Arabic Names (العربية) 🇸🇦</option>
            <option value="fr">French Names (Français) 🇫🇷</option>
        </select>
    </div>
    
    <!-- Gender Filter Buttons -->
    <div class="controls">
        <button class="btn-filter active" onclick="setGender('all', this)">All</button>
        <button class="btn-filter" onclick="setGender('male', this)">Male 👨</button>
        <button class="btn-filter" onclick="setGender('female', this)">Female 👩</button>
    </div>

    <!-- Display Area -->
    <div class="display-area">
        
        <!-- First Name Box -->
        <div class="name-row">
            <div class="name-info">
                <div class="label">First Name</div>
                <div class="name-val" id="firstNameVal">-</div>
            </div>
            <button class="btn-copy-small" onclick="copySingle('firstNameVal', this)">Copy First</button>
        </div>

        <!-- Last Name Box -->
        <div class="name-row">
            <div class="name-info">
                <div class="label">Last Name</div>
                <div class="name-val" id="lastNameVal">-</div>
            </div>
            <button class="btn-copy-small" onclick="copySingle('lastNameVal', this)">Copy Last</button>
        </div>

    </div>

    <!-- Actions -->
    <div class="action-btns">
        <button class="btn-primary" onclick="generateAIName()">✨ Generate Smart Unique Name</button>
        <button class="btn-secondary" id="fullCopyBtn" onclick="copyFullName(this)">Copy Full Name</button>
    </div>
</div>

<script>
    // System Memory Bank (Guarantees zero duplicates)
    const generatedHistory = new Set();
    let currentGender = 'all';

    // AI Procedural Dataset for English
    const englishAI = {
        maleRoots: ["Alex", "Liam", "Ethan", "Noah", "Oliver", "Lucas", "Mason", "Logan", "James", "Benjamin", "Henry", "Jacob", "William", "Daniel", "Matthew"],
        femaleRoots: ["Emma", "Olivia", "Ava", "Sophia", "Isabella", "Mia", "Amelia", "Harper", "Evelyn", "Abigail", "Emily", "Ella", "Scarlett", "Grace", "Chloe"],
        surPrefixes: ["Mc", "O'", "Fitz", "Van ", "De "],
        surRoots: ["Smith", "Johnson", "Williams", "Brown", "Jones", "Garcia", "Miller", "Davis", "Rodriguez", "Martinez", "Hernandez", "Lopez", "Gonzalez", "Wilson", "Anderson", "Thomas", "Taylor", "Moore", "Jackson", "Martin"],
        surSuffixes: ["son", "ford", "ton", "field", "wood", "berg", "stein", "worth"]
    };

    // AI Procedural Dataset for Arabic
    const arabicAI = {
        maleRoots: ["طارق", "زايد", "فارس", "كريم", "عمر", "أمير", "حمزة", "يوسف", "سليمان", "عبد الله", "زياد", "راشد", "سهيل", "ياسين", "سليم", "بلال", "سعود", "فيصل"],
        femaleRoots: ["نور", "ليلى", "زهراء", "آية", "مريم", "أميرة", "سارة", "فاطمة", "حواء", "خديجة", "ريم", "جودي", "دانة", "سلمى", "هدى", "لينا", "ياسمين", "زينب"],
        surPrefixes: ["الـ", "آل ", "بن ", "أبو "],
        surRoots: ["حسن", "نجار", "سيد", "شريف", "ملك", "علي", "منصور", "رشيد", "فاروق", "قاسم", "هاشم", "طاهر", "حداد", "عزيز", "سليمان", "حكيم", "عطاء", "صالح"]
    };

    // AI Procedural Dataset for French
    const frenchAI = {
        maleRoots: ["Ibrahim", "Oumar", "Moussa", "Tariq", "Faris", "Karim", "Kouassi", "Koffi", "Jean-Baptiste", "Stephane", "Franck", "Marc", "Tiemoko", "Bakary"],
        femaleRoots: ["Awa", "Bintou", "Fatou", "Nour", "Layla", "Aya", "Maryam", "Zahra", "Adjoua", "Amenan", "Affoué", "Akissi", "Kadiatou", "Marie", "Christelle"],
        surRoots: ["Coulibaly", "Traoré", "Diallo", "Touré", "Cissé", "Bamba", "Koné", "Kouamé", "N'Guessan", "Yao", "Ouattara", "Diarra", "Fofana", "Gbagbo", "Bedie"]
    };

    function setGender(gender, element) {
        currentGender = gender;
        document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        generateAIName();
    }

    function getRandomItem(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    // Smart Procedural Generation Engine
    function buildAILastName(lang) {
        if (lang === 'en') {
            const mode = Math.random();
            if (mode < 0.3) {
                return getRandomItem(englishAI.surPrefixes) + getRandomItem(englishAI.surRoots);
            } else if (mode < 0.6) {
                return getRandomItem(englishAI.surRoots) + getRandomItem(englishAI.surSuffixes);
            }
            return getRandomItem(englishAI.surRoots);
        } else if (lang === 'ar') {
            const prefix = getRandomItem(arabicAI.surPrefixes);
            const root = getRandomItem(arabicAI.surRoots);
            return (prefix === "الـ") ? ("ال" + root) : (prefix + root);
        } else {
            return getRandomItem(frenchAI.surRoots);
        }
    }

    function generateAIName() {
        const langMode = document.getElementById('languageSelect').value;
        let attempts = 0;
        let selectedFirst = "";
        let selectedLast = "";
        let fullNameKey = "";

        while (attempts < 1000) {
            let pool = [];
            if (langMode === 'en') {
                if (currentGender === 'male') pool = englishAI.maleRoots;
                else if (currentGender === 'female') pool = englishAI.femaleRoots;
                else pool = [...englishAI.maleRoots, ...englishAI.femaleRoots];
            } else if (langMode === 'ar') {
                if (currentGender === 'male') pool = arabicAI.maleRoots;
                else if (currentGender === 'female') pool = arabicAI.femaleRoots;
                else pool = [...arabicAI.maleRoots, ...arabicAI.femaleRoots];
            } else if (langMode === 'fr') {
                if (currentGender === 'male') pool = frenchAI.maleRoots;
                else if (currentGender === 'female') pool = frenchAI.femaleRoots;
                else pool = [...frenchAI.maleRoots, ...frenchAI.femaleRoots];
            }

            selectedFirst = getRandomItem(pool);
            selectedLast = buildAILastName(langMode);
            fullNameKey = `${selectedFirst} ${selectedLast}_${langMode}`;

            // Check against global memory to ensure no duplicates
            if (!generatedHistory.has(fullNameKey)) {
                generatedHistory.add(fullNameKey);
                break;
            }
            attempts++;
        }

        const fEl = document.getElementById('firstNameVal');
        const lEl = document.getElementById('lastNameVal');

        fEl.textContent = selectedFirst;
        lEl.textContent = selectedLast;

        if (langMode === 'ar') {
            fEl.classList.add('rtl-text');
            lEl.classList.add('rtl-text');
        } else {
            fEl.classList.remove('rtl-text');
            lEl.classList.remove('rtl-text');
        }
    }

    // Silent Copy Functions (No Alert Popups)
    function copySingle(elementId, btnElement) {
        const text = document.getElementById(elementId).textContent;
        if (text === "-") return;

        navigator.clipboard.writeText(text).then(() => {
            const originalText = btnElement.textContent;
            btnElement.textContent = "Copied! ✓";
            btnElement.classList.add('copied');
            
            setTimeout(() => {
                btnElement.textContent = originalText;
                btnElement.classList.remove('copied');
            }, 1200);
        });
    }

    function copyFullName(btnElement) {
        const fName = document.getElementById('firstNameVal').textContent;
        const lName = document.getElementById('lastNameVal').textContent;

        if (fName === "-") return;

        const fullName = `${fName} ${lName}`;
        navigator.clipboard.writeText(fullName).then(() => {
            const originalText = btnElement.textContent;
            btnElement.textContent = "Copied Full Name! ✓";
            btnElement.classList.add('copied');

            setTimeout(() => {
                btnElement.textContent = originalText;
                btnElement.classList.remove('copied');
            }, 1200);
        });
    }

    window.onload = function() {
        generateAIName();
    };
</script>

</body>
</html>
