<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Human Name Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h2 {
            color: #1e293b;
            margin-bottom: 20px;
        }

        .lang-select-box {
            margin-bottom: 20px;
            text-align: left;
        }

        .lang-select-box label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            display: block;
            margin-bottom: 6px;
        }

        .select-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 2px solid #cbd5e1;
            font-size: 1rem;
            font-weight: 600;
            color: #1e293b;
            background: #ffffff;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .select-input:focus {
            border-color: #0f766e;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .btn-filter {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.2s ease;
        }

        .btn-filter.active {
            background: #0f766e;
            color: white;
            border-color: #0f766e;
        }

        .display-area {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }

        .name-info {
            text-align: left;
            width: 100%;
        }

        .label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .name-val {
            color: #0f766e;
            font-size: 1.4rem;
            font-weight: bold;
        }

        .rtl-text {
            direction: rtl;
            text-align: right;
        }

        .btn-copy-small {
            background: #e2e8f0;
            color: #334155;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            margin-left: 10px;
        }

        .btn-copy-small:hover {
            background: #cbd5e1;
        }

        .btn-copy-small.copied {
            background: #10b981;
            color: white;
        }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-primary {
            background: #0f766e;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #0d9488;
        }

        .btn-secondary {
            background: transparent;
            color: #64748b;
            border: 1px solid #cbd5e1;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: #f1f5f9;
        }

        .btn-secondary.copied {
            background: #10b981;
            color: white;
            border-color: #10b981;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>AI Human Name Generator</h2>

    <!-- Country / Language Option -->
    <div class="lang-select-box">
        <label for="languageSelect">Select Country / Region</label>
        <select id="languageSelect" class="select-input" onchange="generateHumanAIName(true)">
            <option value="en">English (US / UK / Global) 🇬🇧 🇺🇸</option>
            <option value="ar">Arabic (Middle East / Gulf) 🇸🇦 🇦🇪</option>
            <option value="fr">French (Europe / West Africa) 🇫🇷 🇨🇮</option>
        </select>
    </div>
    
    <!-- Gender Controls -->
    <div class="controls">
        <button class="btn-filter active" id="btn-all" onclick="setGender('all', this)">All</button>
        <button class="btn-filter" id="btn-male" onclick="setGender('male', this)">Male 👨</button>
        <button class="btn-filter" id="btn-female" onclick="setGender('female', this)">Female 👩</button>
    </div>

    <!-- Display Area -->
    <div class="display-area">
        
        <!-- First Name Row -->
        <div class="name-row">
            <div class="name-info">
                <div class="label">First Name</div>
                <div class="name-val" id="firstNameVal">-</div>
            </div>
            <button class="btn-copy-small" onclick="copySingle('firstNameVal', this)">Copy First</button>
        </div>

        <!-- Last Name Row -->
        <div class="name-row">
            <div class="name-info">
                <div class="label">Last Name</div>
                <div class="name-val" id="lastNameVal">-</div>
            </div>
            <button class="btn-copy-small" onclick="copySingle('lastNameVal', this)">Copy Last</button>
        </div>

    </div>

    <!-- Action Buttons -->
    <div class="action-btns">
        <button class="btn-primary" onclick="generateHumanAIName(true)">✨ Generate Natural Human Name</button>
        <button class="btn-secondary" id="fullCopyBtn" onclick="copyFullName(this)">Copy Full Name</button>
    </div>
</div>

<script>
    let currentGender = 'all';

    // Natural Human Datasets (Authentic & Realistic)
    const humanDatasets = {
        en: {
            male: ["Liam", "Noah", "Oliver", "James", "Elijah", "William", "Henry", "Lucas", "Benjamin", "Theodore", "Mateo", "Levi", "Alexander", "Jackson", "Daniel", "Michael", "Mason", "Sebastian", "Ethan", "Logan", "Owen", "Samuel", "Jacob", "Asher", "Joseph"],
            female: ["Olivia", "Emma", "Charlotte", "Amelia", "Sophia", "Isabella", "Ava", "Mia", "Evelyn", "Harper", "Luna", "Camila", "Gianna", "Elizabeth", "Eleanor", "Ella", "Abigail", "Sophia", "Avery", "Scarlett", "Emily", "Hazel", "Chloe", "Penelope"],
            surnames: ["Smith", "Johnson", "Williams", "Brown", "Jones", "Garcia", "Miller", "Davis", "Rodriguez", "Martinez", "Hernandez", "Lopez", "Gonzalez", "Wilson", "Anderson", "Thomas", "Taylor", "Moore", "Jackson", "Martin", "Lee", "Perez", "Thompson", "White", "Harris", "Clark", "Lewis", "Robinson", "Walker", "Young"]
        },
        ar: {
            male: ["عمر", "حمزة", "طارق", "يوسف", "زياد", "كريم", "فارس", "أمير", "سليمان", "عبد الله", "فيصل", "راشد", "سهيل", "ياسين", "سليم", "بلال", "سعود", "خالد", "حسن", "مالك"],
            female: ["نور", "ليلى", "زهراء", "آية", "مريم", "أميرة", "سارة", "فاطمة", "حواء", "خديجة", "ريم", "جودي", "دانة", "سلمى", "هدى", "لينا", "ياسمين", "زينب", "روعة", "شهد"],
            surnames: ["المنصور", "الفارسي", "الهاشمي", "النجار", "الزهراني", "الغامدي", "الشمري", "الحربي", "العتيبي", "السيد", "الشريف", "المصري", "القحطاني", "المالكي", "الدوسري", "التميمي"]
        },
        fr: {
            male: ["Ibrahim", "Oumar", "Moussa", "Tariq", "Kouassi", "Koffi", "Lucas", "Gabriel", "Louis", "Raphaël", "Arthur", "Hugo", "Jules", "Maël", "Liam", "Franck", "Bakary", "Stephane"],
            female: ["Awa", "Bintou", "Fatou", "Nour", "Layla", "Aya", "Maryam", "Adjoua", "Amenan", "Jade", "Louise", "Ambre", "Alba", "Emma", "Rose", "Alice", "Kadiatou", "Marie"],
            surnames: ["Coulibaly", "Traoré", "Diallo", "Touré", "Cissé", "Bamba", "Koné", "Kouamé", "N'Guessan", "Diarra", "Fofana", "Ouattara", "Dubois", "Laurent", "Bernard", "Thomas", "Moreau"]
        }
    };

    function setGender(gender, element) {
        currentGender = gender;
        document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        generateHumanAIName(true);
    }

    function getRandomItem(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    // Dynamic History Memory Manager (Uses LocalStorage to avoid duplicates)
    function getHistory() {
        try {
            return JSON.parse(localStorage.getItem('ai_human_names_history')) || [];
        } catch(e) {
            return [];
        }
    }

    function saveToHistory(fullNameKey) {
        let history = getHistory();
        if (!history.includes(fullNameKey)) {
            history.push(fullNameKey);
            // Keep memory optimized to last 5000 generated names
            if (history.length > 5000) history.shift();
            localStorage.setItem('ai_human_names_history', JSON.stringify(history));
        }
    }

    function generateHumanAIName(isUserClick = false) {
        const langMode = document.getElementById('languageSelect').value;

        // Restore saved name if website reloaded automatically
        if (!isUserClick) {
            const savedState = localStorage.getItem('ai_current_name_lock');
            if (savedState) {
                const data = JSON.parse(savedState);
                document.getElementById('languageSelect').value = data.lang;
                currentGender = data.gender || 'all';
                
                document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
                const activeBtn = document.getElementById(`btn-${currentGender}`);
                if (activeBtn) activeBtn.classList.add('active');

                applyNameToUI(data.first, data.last, data.lang);
                return;
            }
        }

        const dataset = humanDatasets[langMode] || humanDatasets.en;
        const history = getHistory();

        let attempts = 0;
        let selectedFirst = "";
        let selectedLast = "";
        let fullNameKey = "";

        // AI Unique Name Combination Engine
        while (attempts < 2000) {
            let firstPool = [];
            if (currentGender === 'male') {
                firstPool = dataset.male;
            } else if (currentGender === 'female') {
                firstPool = dataset.female;
            } else {
                firstPool = [...dataset.male, ...dataset.female];
            }

            selectedFirst = getRandomItem(firstPool);
            selectedLast = getRandomItem(dataset.surnames);

            fullNameKey = `${selectedFirst} ${selectedLast}_${langMode}`;

            // Ensure name is completely unique and never used before
            if (!history.includes(fullNameKey)) {
                saveToHistory(fullNameKey);
                break;
            }
            attempts++;
        }

        // Lock name in local memory so country/IP change won't reset it
        localStorage.setItem('ai_current_name_lock', JSON.stringify({
            first: selectedFirst,
            last: selectedLast,
            lang: langMode,
            gender: currentGender
        }));

        applyNameToUI(selectedFirst, selectedLast, langMode);
    }

    function applyNameToUI(first, last, lang) {
        const fEl = document.getElementById('firstNameVal');
        const lEl = document.getElementById('lastNameVal');

        fEl.textContent = first;
        lEl.textContent = last;

        if (lang === 'ar') {
            fEl.classList.add('rtl-text');
            lEl.classList.add('rtl-text');
        } else {
            fEl.classList.remove('rtl-text');
            lEl.classList.remove('rtl-text');
        }
    }

    // Silent Copy Functions
    function copySingle(elementId, btnElement) {
        const text = document.getElementById(elementId).textContent;
        if (text === "-") return;

        navigator.clipboard.writeText(text).then(() => {
            const originalText = btnElement.textContent;
            btnElement.textContent = "Copied! ✓";
            btnElement.classList.add('copied');
            
            setTimeout(() => {
                btnElement.textContent = originalText;
                btnElement.classList.remove('copied');
            }, 1200);
        });
    }

    function copyFullName(btnElement) {
        const fName = document.getElementById('firstNameVal').textContent;
        const lName = document.getElementById('lastNameVal').textContent;

        if (fName === "-") return;

        const fullName = `${fName} ${lName}`;
        navigator.clipboard.writeText(fullName).then(() => {
            const originalText = btnElement.textContent;
            btnElement.textContent = "Copied Full Name! ✓";
            btnElement.classList.add('copied');

            setTimeout(() => {
                btnElement.textContent = originalText;
                btnElement.classList.remove('copied');
            }, 1200);
        });
    }

    window.onload = function() {
        generateHumanAIName(false);
    };
</script>

</body>
</html>
