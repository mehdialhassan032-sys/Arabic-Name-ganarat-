<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Human Name Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        /* Privacy Lock Overlay */
        .lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .lock-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .lock-box h3 {
            color: #1e293b;
            margin-bottom: 8px;
        }

        .lock-box p {
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .pass-input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #cbd5e1;
            font-size: 1.1rem;
            text-align: center;
            letter-spacing: 4px;
            outline: none;
            margin-bottom: 15px;
        }

        .pass-input:focus {
            border-color: #0f766e;
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.8rem;
            font-weight: 600;
            display: none;
            margin-bottom: 10px;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h2 {
            color: #1e293b;
            margin-bottom: 20px;
        }

        .lang-select-box {
            margin-bottom: 20px;
            text-align: left;
        }

        .lang-select-box label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            display: block;
            margin-bottom: 6px;
        }

        .select-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 2px solid #cbd5e1;
            font-size: 1rem;
            font-weight: 600;
            color: #1e293b;
            background: #ffffff;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .select-input:focus {
            border-color: #0f766e;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .btn-filter {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.2s ease;
        }

        .btn-filter.active {
            background: #0f766e;
            color: white;
            border-color: #0f766e;
        }

        .display-area {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }

        .name-info {
            text-align: left;
            width: 100%;
        }

        .label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .name-val {
            color: #0f766e;
            font-size: 1.4rem;
            font-weight: bold;
        }

        .rtl-text {
            direction: rtl;
            text-align: right;
        }

        .btn-copy-small {
            background: #e2e8f0;
            color: #334155;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            margin-left: 10px;
        }

        .btn-copy-small:hover {
            background: #cbd5e1;
        }

        .btn-copy-small.copied {
            background: #10b981;
            color: white;
        }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-primary {
            background: #0f766e;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #0d9488;
        }

        .btn-secondary {
            background: transparent;
            color: #64748b;
            border: 1px solid #cbd5e1;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: #f1f5f9;
        }

        .btn-secondary.copied {
            background: #10b981;
            color: white;
            border-color: #10b981;
        }
    </style>
</head>
<body>

<!-- Security Lock Screen -->
<div class="lock-screen" id="lockScreen">
    <div class="lock-box">
        <h3>Protected Access</h3>
        <p>Enter 6-digit PIN to access AI Human Name Generator</p>
        <input type="password" id="passInput" class="pass-input" maxlength="6" placeholder="••••••" />
        <div class="error-msg" id="errorMsg">Incorrect Password! Access Denied.</div>
        <button class="btn-primary" style="width: 100%;" onclick="unlockApp()">Unlock Website</button>
    </div>
</div>

<div class="card">
    <h2>AI Human Name Generator</h2>

    <!-- Country Option -->
    <div class="lang-select-box">
        <label for="languageSelect">Select Country / Region</label>
        <select id="languageSelect" class="select-input" onchange="generateHumanAIName(true)">
            <option value="sy">Syria (سوريا) 🇸🇾</option>
            <option value="en">English (US / UK / Global) 🇬🇧 🇺🇸</option>
            <option value="ar">Arabic (Gulf / General) 🇸🇦 🇦🇪</option>
            <option value="fr">French (Europe / Africa) 🇫🇷 🇨🇮</option>
        </select>
    </div>
    
    <!-- Gender Controls -->
    <div class="controls">
        <button class="btn-filter active" id="btn-all" onclick="setGender('all', this)">All</button>
        <button class="btn-filter" id="btn-male" onclick="setGender('male', this)">Male 👨</button>
        <button class="btn-filter" id="btn-female" onclick="setGender('female', this)">Female 👩</button>
    </div>

    <!-- Display Area -->
    <div class="display-area">
        <div class="name-row">
            <div class="name-info">
                <div class="label">First Name</div>
                <div class="name-val" id="firstNameVal">-</div>
            </div>
            <button class="btn-copy-small" onclick="copySingle('firstNameVal', this)">Copy First</button>
        </div>

        <div class="name-row">
            <div class="name-info">
                <div class="label">Last Name</div>
                <div class="name-val" id="lastNameVal">-</div>
            </div>
            <button class="btn-copy-small" onclick="copySingle('lastNameVal', this)">Copy Last</button>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-btns">
        <button class="btn-primary" onclick="generateHumanAIName(true)">✨ Generate Natural Human Name</button>
        <button class="btn-secondary" id="fullCopyBtn" onclick="copyFullName(this)">Copy Full Name</button>
    </div>
</div>

<script>
    // --- 1. PRIVACY LOCK SYSTEM ---
    const APP_PASS = "876183";

    function checkAuth() {
        const isUnlocked = sessionStorage.getItem('app_unlocked');
        if (isUnlocked === 'true') {
            document.getElementById('lockScreen').style.display = 'none';
        }
    }

    function unlockApp() {
        const input = document.getElementById('passInput').value;
        const err = document.getElementById('errorMsg');
        
        if (input === APP_PASS) {
            sessionStorage.setItem('app_unlocked', 'true');
            document.getElementById('lockScreen').style.display = 'none';
            err.style.display = 'none';
        } else {
            err.style.display = 'block';
            document.getElementById('passInput').value = '';
        }
    }

    document.getElementById('passInput')?.addEventListener('keyup', function(e) {
        if (e.key === 'Enter') unlockApp();
    });

    // --- 2. ADVANCED REAL-HUMAN AI GENERATION ENGINE ---
    let currentGender = 'all';

    const aiPhonetics = {
        sy: {
            male: ["مجد", "يزن", "باسل", "إياد", "ملهم", "غياث", "علاء", "قصي", "فراس", "وائل", "وسيم", "تمام", "أنس", "نزار", "بشار", "عروة", "ماهر", "مأمون", "سامر", "نديم", "طارق", "زياد", "كريم", "حسام", "شادي"],
            female: ["شام", "سيدرا", "جوليا", "يارا", "لين", "نايا", "لجين", "رنيم", "ماسة", "كندا", "سلاف", "سيرين", "ديمة", "بيسان", "تالا", "جنى", "فرح", "نور", "ميس", "راما", "روان", "تولين"],
            surPrefixes: ["الـ", "آل "],
            surnames: ["الشامي", "الحلبي", "الحمصي", "الخطيب", "الحموي", "اللاذقاني", "العطار", "الحكيم", "النجار", "السيد", "القدسي", "الكردي", "الحسن", "الدمشقي", "الرفاعي", "الزهري", "الكيالي", "البرزي", "الملا", "الأسد"]
        },
        en: {
            malePrefixes: ["Al", "Ben", "Dan", "Ed", "Fred", "Gar", "Har", "Jack", "Ken", "Leo", "Matt", "Nate", "Phil", "Ray", "Sam", "Tom", "Will", "Zack", "Bro", "Clint", "Dust", "Ethan", "Felix", "Gavin"],
            maleSuffixes: ["ander", "jamin", "iel", "ward", "erick", "rett", "old", "son", "nard", "ton", "vis", "mon", "rence", "cent", "ry", "ver", "ton", "tian"],
            femalePrefixes: ["Am", "Bri", "Cl", "Da", "El", "Fay", "Gr", "Ha", "Is", "Jul", "Ka", "Ly", "Ma", "Nor", "Ol", "Pen", "Ros", "Soph", "Tess", "Val", "Viv", "Zoe"],
            femaleSuffixes: ["elia", "anna", "ora", "phina", "etta", "lyn", "ica", "abel", "ia", "ette", "ine", "issa", "elle", "andra", "een", "icia", "ole"],
            surPrefixes: ["Mc", "O'", "Van ", "De ", "Fitz"],
            surBases: ["smith", "johnson", "williams", "brown", "jones", "miller", "davis", "wilson", "taylor", "white", "harris", "martin", "clark", "lewis", "walker", "hall", "young", "king", "wright"],
            surSuffixes: ["field", "ford", "wood", "berg", "ton", "stein", "worth", "burn", "ley", "brook", "cross", "mont"]
        },
        ar: {
            malePrefixes: ["عبد ", "أبو ", "بن "],
            maleBases: ["الله", "الرحمن", "الرحيم", "الملك", "عمر", "حمزة", "طارق", "يوسف", "زياد", "كريم", "فارس", "أمير", "سليمان", "فيصل", "راشد", "سهيل", "ياسين", "سليم", "بلال", "سعود", "خالد", "حسن", "مالك", "وليد"],
            femaleBases: ["نور", "ليلى", "زهراء", "آية", "مريم", "أميرة", "سارة", "فاطمة", "حواء", "خديجة", "ريم", "جودي", "دانة", "سلمى", "هدى", "لينا", "ياسمين", "زينب", "روعة", "شهد", "مرام", "ريناد"],
            surPrefixes: ["الـ", "آل "],
            surBases: ["منصور", "فارسي", "هاشمي", "نجار", "زهراني", "غامدي", "شمري", "حربي", "عتيبي", "سيد", "شريف", "مصري", "قحطاني", "مالكي", "دوسري", "تميمي", "عمري", "رشيد", "حداد"]
        },
        fr: {
            malePrefixes: ["Jean-", "Marc-", "Pierre-", "Louis-"],
            maleBases: ["Luc", "Paul", "Antoine", "Baptiste", "Franck", "Jacques", "Michel", "Ibrahim", "Oumar", "Moussa", "Tariq", "Kouassi", "Koffi", "Bakary", "Stephane", "Gaston", "Laurent"],
            femaleBases: ["Awa", "Bintou", "Fatou", "Nour", "Layla", "Aya", "Maryam", "Adjoua", "Amenan", "Jade", "Louise", "Ambre", "Alba", "Emma", "Rose", "Alice", "Kadiatou", "Marie", "Chantal"],
            surBases: ["Coulibaly", "Traoré", "Diallo", "Touré", "Cissé", "Bamba", "Koné", "Kouamé", "N'Guessan", "Diarra", "Fofana", "Ouattara", "Dubois", "Laurent", "Bernard", "Thomas", "Moreau"]
        }
    };

    function getRandomItem(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function capitalize(str) {
        if (!str) return '';
        return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
    }

    function synthesizeHumanName(lang, gender) {
        const data = aiPhonetics[lang] || aiPhonetics.sy;
        let firstName = "";
        let lastName = "";

        const isMale = (gender === 'male') ? true : (gender === 'female') ? false : Math.random() < 0.5;

        // Syrian Real Human Naming Logic
        if (lang === 'sy') {
            firstName = isMale ? getRandomItem(data.male) : getRandomItem(data.female);
            lastName = getRandomItem(data.surnames);
        } else if (lang === 'en') {
            if (isMale) {
                if (Math.random() < 0.6) firstName = getRandomItem(data.malePrefixes) + getRandomItem(data.maleSuffixes);
                else firstName = getRandomItem(["Liam", "Noah", "Oliver", "James", "Elijah", "William", "Henry", "Lucas", "Benjamin", "Theodore", "Mateo", "Levi", "Alexander", "Jackson", "Daniel"]);
            } else {
                if (Math.random() < 0.6) firstName = getRandomItem(data.femalePrefixes) + getRandomItem(data.femaleSuffixes);
                else firstName = getRandomItem(["Olivia", "Emma", "Charlotte", "Amelia", "Sophia", "Isabella", "Ava", "Mia", "Evelyn", "Harper", "Luna", "Camila", "Gianna"]);
            }
            firstName = capitalize(firstName);
            const mode = Math.random();
            if (mode < 0.2) lastName = getRandomItem(data.surPrefixes) + capitalize(getRandomItem(data.surBases));
            else if (mode < 0.5) lastName = capitalize(getRandomItem(data.surBases)) + getRandomItem(data.surSuffixes);
            else lastName = capitalize(getRandomItem(data.surBases));
        } else if (lang === 'ar') {
            firstName = isMale ? ((Math.random() < 0.3 ? getRandomItem(data.malePrefixes) : '') + getRandomItem(data.maleBases)) : getRandomItem(data.femaleBases);
            const base = getRandomItem(data.surBases);
            const prefix = getRandomItem(data.surPrefixes);
            lastName = (prefix === "الـ") ? ("ال" + base) : (prefix + base);
        } else if (lang === 'fr') {
            firstName = isMale ? ((Math.random() < 0.25 ? getRandomItem(data.malePrefixes) : '') + getRandomItem(data.maleBases)) : getRandomItem(data.femaleBases);
            lastName = getRandomItem(data.surBases);
        }

        return { first: firstName, last: lastName };
    }

    function setGender(gender, element) {
        currentGender = gender;
        document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        generateHumanAIName(true);
    }

    function getHistory() {
        try {
            return JSON.parse(localStorage.getItem('ai_human_names_history')) || [];
        } catch(e) {
            return [];
        }
    }

    function saveToHistory(fullNameKey) {
        let history = getHistory();
        if (!history.includes(fullNameKey)) {
            history.push(fullNameKey);
            if (history.length > 15000) history.shift();
            localStorage.setItem('ai_human_names_history', JSON.stringify(history));
        }
    }

    function generateHumanAIName(isUserClick = false) {
        const langMode = document.getElementById('languageSelect').value;

        if (!isUserClick) {
            const savedState = localStorage.getItem('ai_current_name_lock');
            if (savedState) {
                const data = JSON.parse(savedState);
                document.getElementById('languageSelect').value = data.lang;
                currentGender = data.gender || 'all';
                
                document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
                const activeBtn = document.getElementById(`btn-${currentGender}`);
                if (activeBtn) activeBtn.classList.add('active');

                applyNameToUI(data.first, data.last, data.lang);
                return;
            }
        }

        const history = getHistory();
        let attempts = 0;
        let nameObj = { first: "", last: "" };
        let fullNameKey = "";

        while (attempts < 4000) {
            nameObj = synthesizeHumanName(langMode, currentGender);
            fullNameKey = `${nameObj.first} ${nameObj.last}_${langMode}`;

            if (!history.includes(fullNameKey)) {
                saveToHistory(fullNameKey);
                break;
            }
            attempts++;
        }

        localStorage.setItem('ai_current_name_lock', JSON.stringify({
            first: nameObj.first,
            last: nameObj.last,
            lang: langMode,
            gender: currentGender
        }));

        applyNameToUI(nameObj.first, nameObj.last, langMode);
    }

    function applyNameToUI(first, last, lang) {
        const fEl = document.getElementById('firstNameVal');
        const lEl = document.getElementById('lastNameVal');

        fEl.textContent = first;
        lEl.textContent = last;

        if (lang === 'ar' || lang === 'sy') {
            fEl.classList.add('rtl-text');
            lEl.classList.add('rtl-text');
        } else {
            fEl.classList.remove('rtl-text');
            lEl.classList.remove('rtl-text');
        }
    }

    // --- 3. ROBUST COPY ENGINE ---
    function fallbackCopyText(textToCopy) {
        const textArea = document.createElement("textarea");
        textArea.value = textToCopy;
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        
        try {
            document.execCommand('copy');
        } catch (err) {
            console.error('Fallback copy failed: ', err);
        }
        
        document.body.removeChild(textArea);
    }

    function copyTextToClipboard(text, btnElement, successLabel) {
        if (!text || text === "-") return;

        const originalText = btnElement.textContent;

        const handleSuccess = () => {
            btnElement.textContent = successLabel;
            btnElement.classList.add('copied');
            setTimeout(() => {
                btnElement.textContent = originalText;
                btnElement.classList.remove('copied');
            }, 1200);
        };

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text)
                .then(handleSuccess)
                .catch(() => {
                    fallbackCopyText(text);
                    handleSuccess();
                });
        } else {
            fallbackCopyText(text);
            handleSuccess();
        }
    }

    function copySingle(elementId, btnElement) {
        const text = document.getElementById(elementId).textContent;
        copyTextToClipboard(text, btnElement, "Copied! ✓");
    }

    function copyFullName(btnElement) {
        const fName = document.getElementById('firstNameVal').textContent;
        const lName = document.getElementById('lastNameVal').textContent;
        if (fName === "-" || lName === "-") return;
        
        const fullName = `${fName} ${lName}`;
        copyTextToClipboard(fullName, btnElement, "Copied Full Name! ✓");
    }

    window.onload = function() {
        checkAuth();
        generateHumanAIName(false);
    };
</script>

</body>
</html>
