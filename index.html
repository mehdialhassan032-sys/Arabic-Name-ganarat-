<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Noms de Côte d'Ivoire</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h2 {
            color: #1e293b;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .btn-filter {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.2s ease;
        }

        .btn-filter.active {
            background: #047857;
            color: white;
            border-color: #047857;
        }

        .display-area {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }

        .name-info {
            text-align: left;
            width: 100%;
        }

        .label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .french-val {
            color: #047857;
            font-size: 1.4rem;
            font-weight: bold;
        }

        .btn-copy-small {
            background: #e2e8f0;
            color: #334155;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            margin-left: 10px;
        }

        .btn-copy-small:hover {
            background: #cbd5e1;
        }

        .btn-copy-small.copied {
            background: #10b981;
            color: white;
        }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-primary {
            background: #047857;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #059669;
        }

        .btn-secondary {
            background: transparent;
            color: #64748b;
            border: 1px solid #cbd5e1;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: #f1f5f9;
        }

        .btn-secondary.copied {
            background: #10b981;
            color: white;
            border-color: #10b981;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Générateur Côte d'Ivoire 🇨🇮</h2>
    
    <!-- Filter Buttons -->
    <div class="controls">
        <button class="btn-filter active" onclick="setGender('all', this)">Tous</button>
        <button class="btn-filter" onclick="setGender('male', this)">Homme 👨</button>
        <button class="btn-filter" onclick="setGender('female', this)">Femme 👩</button>
    </div>

    <!-- Display Area -->
    <div class="display-area">
        
        <!-- First Name Row -->
        <div class="name-row">
            <div class="name-info">
                <div class="label">PRÉNOM</div>
                <div class="french-val" id="firstNameFr">-</div>
            </div>
            <button class="btn-copy-small" onclick="copyText('firstNameFr', this)">Copier</button>
        </div>

        <!-- Last Name Row -->
        <div class="name-row">
            <div class="name-info">
                <div class="label">NOM DE FAMILLE</div>
                <div class="french-val" id="lastNameFr">-</div>
            </div>
            <button class="btn-copy-small" onclick="copyText('lastNameFr', this)">Copier</button>
        </div>

    </div>

    <!-- Actions -->
    <div class="action-btns">
        <button class="btn-primary" onclick="generateUniqueName()">Générer Nom Unique</button>
        <button class="btn-secondary" id="fullCopyBtn" onclick="copyFullName(this)">Copier Nom Complet</button>
    </div>
</div>

<script>
    // Male Ivorian First Names (French & Akan/Mandé origin)
    const maleFirsts = [
        "Kouassi", "Koffi", "Kouadio", "Yao", "Kouamé", "Konan", "Amani", 
        "N'Guessan", "Jean-Baptiste", "Jean-Luc", "Ange", "Stéphane", 
        "Franck", "Marc", "Ibrahim", "Tiemoko", "Oumar", "Moussa", "Bakary"
    ];

    // Female Ivorian First Names
    const femaleFirsts = [
        "Adjoua", "Amenan", "Affoué", "Aya", "Akissi", "Bintou", "Awa", 
        "Fatou", "Kadiatou", "Marie", "Grace", "Christelle", "Syntyche", 
        "Dominique", "Ruth", "Esther", "Clarisse", "Edwige", "Sandrine"
    ];

    // Common Ivorian Surnames (Akan, Gour, Kru, Mandé origins)
    const lastNames = [
        "Kouassi", "Koné", "Coulibaly", "Bamba", "Diallo", "Traoré", 
        "N'Guessan", "Yao", "Kouamé", "Touré", "Ouattara", "Cissé", 
        "Diarra", "Fofana", "Gbagbo", "Bedie", "Dibo", "Sylla", "Sy"
    ];

    let generatedHistory = new Set();
    let currentGender = 'all';

    function setGender(gender, element) {
        currentGender = gender;
        document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        generateUniqueName();
    }

    function getRandomItem(array) {
        return array[Math.floor(Math.random() * array.length)];
    }

    function generateUniqueName() {
        let attempts = 0;
        let selectedFirst = "";
        let selectedLast = "";
        let fullNameKey = "";

        while (attempts < 500) {
            if (currentGender === 'male') {
                selectedFirst = getRandomItem(maleFirsts);
            } else if (currentGender === 'female') {
                selectedFirst = getRandomItem(femaleFirsts);
            } else {
                selectedFirst = getRandomItem([...maleFirsts, ...femaleFirsts]);
            }

            selectedLast = getRandomItem(lastNames);
            fullNameKey = `${selectedFirst} ${selectedLast}`;

            if (!generatedHistory.has(fullNameKey)) {
                generatedHistory.add(fullNameKey);
                break;
            }
            attempts++;
        }

        document.getElementById('firstNameFr').textContent = selectedFirst;
        document.getElementById('lastNameFr').textContent = selectedLast;
    }

    // Silent Copy Function (No Popup Window)
    function copyText(elementId, btnElement) {
        const textToCopy = document.getElementById(elementId).textContent;
        if (textToCopy === "-") return;

        navigator.clipboard.writeText(textToCopy).then(() => {
            const originalText = btnElement.textContent;
            btnElement.textContent = "Copié! ✓";
            btnElement.classList.add('copied');
            
            setTimeout(() => {
                btnElement.textContent = originalText;
                btnElement.classList.remove('copied');
            }, 1200);
        });
    }

    // Silent Full Name Copy Function
    function copyFullName(btnElement) {
        const fName = document.getElementById('firstNameFr').textContent;
        const lName = document.getElementById('lastNameFr').textContent;

        if (fName === "-") return;

        const fullName = `${fName} ${lName}`;
        navigator.clipboard.writeText(fullName).then(() => {
            const originalText = btnElement.textContent;
            btnElement.textContent = "Nom Complet Copié! ✓";
            btnElement.classList.add('copied');

            setTimeout(() => {
                btnElement.textContent = originalText;
                btnElement.classList.remove('copied');
            }, 1200);
        });
    }

    // Auto-run on load
    window.onload = function() {
        generateUniqueName();
    };
</script>

</body>
</html>
